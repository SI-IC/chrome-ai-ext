<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Assistant Settings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      width: 400px;
      min-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    
    h1 {
      font-size: 18px;
      color: #333;
      margin-bottom: 20px;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #555;
      margin-bottom: 5px;
    }
    
    input[type="text"],
    input[type="password"],
    input[type="number"],
    textarea,
    select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      background: white;
    }
    
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    
    button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
    }
    
    button:hover {
      background: #0056b3;
    }
    
    button.secondary {
      background: #6c757d;
    }
    
    button.secondary:hover {
      background: #545b62;
    }
    
    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      display: none;
    }
    
    .status.success {
      display: block;
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .status.error {
      display: block;
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .tabs {
      display: flex;
      margin-bottom: 15px;
      border-bottom: 2px solid #ddd;
    }
    
    .tab {
      padding: 8px 16px;
      cursor: pointer;
      border: none;
      background: none;
      font-size: 13px;
      color: #666;
    }
    
    .tab.active {
      color: #007bff;
      border-bottom: 2px solid #007bff;
      margin-bottom: -2px;
    }
    
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    .chat-container {
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
    }
    
    .message {
      margin-bottom: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      max-width: 85%;
    }
    
    .message.user {
      background: #007bff;
      color: white;
      margin-left: auto;
    }
    
    .message.assistant {
      background: #e9ecef;
      color: #333;
    }
    
    .message.system {
      background: #fff3cd;
      color: #856404;
      font-style: italic;
    }
    
    .loading {
      text-align: center;
      color: #666;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>🤖 LLM Assistant</h1>
  
  <div class="tabs">
    <button class="tab active" data-tab="settings">Settings</button>
    <button class="tab" data-tab="chat">Chat</button>
  </div>
  
  <div id="settings" class="tab-content active">
    <div class="form-group">
      <label for="apiUrl">API Base URL</label>
      <input type="text" id="apiUrl" placeholder="https://api.openai.com/v1">
    </div>
    
    <div class="form-group">
      <label for="apiKey">API Key</label>
      <input type="password" id="apiKey" placeholder="sk-...">
    </div>
    
    <div class="form-group">
      <label for="model">Model Name</label>
      <input type="text" id="model" placeholder="gpt-3.5-turbo">
    </div>
    
    <div class="form-group">
      <label for="maxTokens">Max Tokens</label>
      <input type="number" id="maxTokens" value="1024" min="1" max="128000">
    </div>
    
    <div class="form-group">
      <label for="temperature">Temperature (0-2)</label>
      <input type="number" id="temperature" value="0.7" min="0" max="2" step="0.1">
    </div>
    
    <div class="form-group">
      <label for="systemPrompt">System Prompt</label>
      <textarea id="systemPrompt" placeholder="You are a helpful assistant..."></textarea>
    </div>
    
    <button id="saveBtn">💾 Save Settings</button>
    <button id="testBtn" class="secondary">🧪 Test Connection</button>
    
    <div id="status" class="status"></div>
  </div>
  
  <div id="chat" class="tab-content">
    <div class="chat-container" id="chatContainer">
      <div class="message system">Configure your API settings first, then start chatting!</div>
    </div>
    <textarea id="userMessage" placeholder="Type your message..." style="height: 80px;"></textarea>
    <button id="sendBtn">📤 Send</button>
    <button id="clearBtn" class="secondary">🗑️ Clear Chat</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
